services:
  livesync:
    image: ${LIVESYNC_IMAGE:-ghcr.io/vrtmrz/livesync-cli:edge}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVESYNC_DB_PATH: /data
      LIVESYNC_REWRITE_SETTINGS: ${LIVESYNC_REWRITE_SETTINGS:-false}
      LIVESYNC_USE_PATH_OBFUSCATION: ${LIVESYNC_USE_PATH_OBFUSCATION:-false}
      LIVESYNC_ENCRYPT_INTERNAL_METADATA: ${LIVESYNC_ENCRYPT_INTERNAL_METADATA:-false}
      LIVESYNC_USE_PLUGIN_SYNC_V2: ${LIVESYNC_USE_PLUGIN_SYNC_V2:-false}
      LIVESYNC_CUSTOM_CHUNK_SIZE: ${LIVESYNC_CUSTOM_CHUNK_SIZE:-0}
      LIVESYNC_E2EE_ALGORITHM: ${LIVESYNC_E2EE_ALGORITHM:-v2}
      LIVESYNC_USE_REQUEST_API: ${LIVESYNC_USE_REQUEST_API:-false}
    volumes:
      - ./data/livesync:/data
      - ./data/vault:/vault
      - ./scripts/livesync-entrypoint.sh:/opt/livesync/entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - /opt/livesync/entrypoint.sh
    command:
      - daemon
      - --vault
      - /vault
    stop_grace_period: 30s

  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
      args:
        ALPINE_VERSION: ${BACKUP_ALPINE_VERSION:-3.22}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKUP_SOURCE: /vault
      BACKUP_REPOSITORY: /backup
    volumes:
      - ./data/vault:/vault:ro
      - ./data/git-backup:/backup
    command:
      - --loop
